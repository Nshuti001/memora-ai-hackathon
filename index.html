<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora AI — The Memory Layer for Autonomous AI</title>
    <meta name="description" content="Memora AI gives autonomous agents persistent, searchable, production-grade memory powered by CockroachDB and AWS. Every AI agent remembers." />
    <meta property="og:title" content="Memora AI — The Memory Layer for Autonomous AI" />
    <meta property="og:description" content="Give your AI agents persistent, searchable, production-grade memory. Powered by CockroachDB and AWS." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Runs before first paint so the correct theme is applied without a flash. Kept inline and
      // dependency-free on purpose: anything async here is already too late.
      (function () {
        try {
          var stored = localStorage.getItem('memora.theme');
          var dark = stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
